# Complete Python speculative Code Mode capability in one bundle.
# Upstream spec-ptc's shadow evaluator is Python, so this bundle intentionally
# replaces the stock TypeScript CodeRuntime for the selected profile.
- id: code-runtime
  disabled: true
- insert:
    - id: code-runtime-python-uv
      name: '@morewax/dsh-spec-ptc/python-runtime'
      config:
        uv: uv
        python: '3.12'
        cpuSeconds: 60
        maxWallMs: 600000
        addressSpaceBytes: 536870912
        maxOutputBytes: 67108864
        maxFrameBytes: 67108864

    - id: spec-ptc
      name: '@morewax/dsh-spec-ptc'
      config:
        socketPath: /tmp/spec-ptc.sock
        autoStart: true
        feedEnabled: true
        engine: dsh
        uvBin: uv
        translateRunCode: true
        wrapRegistry: true
        speculatableTools: []  # PURE tools only; explicit opt-in
