# dsh-spec-ptc: speculative programmatic tool calling. The bundle inserts
# its own row; later user/profile overlays may override it by id.
# Fail-open: no daemon or empty allowlist -> tools execute normally.
- insert:
    - id: spec-ptc
      name: '@morewax/dsh-spec-ptc'
      config:
        socketPath: /tmp/spec-ptc.sock
        autoStart: true
        feedEnabled: true
        engine: dsh
        translateRunCode: true
        wrapRegistry: true
        speculatableTools: []  # PURE tools only; explicit opt-in
